---
- name: Deploy Apache with system info page
  hosts: my_group
  become: true
  roles:
    - apache_info

  tasks:
    - name: Verify Apache returns HTTP 200
      uri:
        url: "http://{{ ansible_default_ipv4.address }}"
        method: GET
        timeout: 10
        return_content: false
      register: apache_check
      failed_when: apache_check.status != 200
      tags:
        - verify