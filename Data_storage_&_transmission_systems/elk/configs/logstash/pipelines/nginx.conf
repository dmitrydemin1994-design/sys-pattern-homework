input {
  beats {
    port => 5044
  }
}

filter {
  if [fields][service] == "auth_log" {
    # --- 1. Разбор syslog-заголовка ---
    grok {
      match => {
        "message" => [
          "%{TIMESTAMP_ISO8601:_ts} %{HOSTNAME:hostname} %{DATA:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:body}",
          "%{TIMESTAMP_ISO8601:_ts} %{HOSTNAME:hostname} %{DATA:program}: %{GREEDYDATA:body}"
        ]
      }
      tag_on_failure => ["_syslog_parse_failed"]
    }

    date {
      match  => ["_ts", "ISO8601"]
      target => "@timestamp"
    }

    mutate {
      remove_field => ["_ts"]
    }

    # --- 2. CRON / cron / systemd / atd / (systemd) ---
    if [program] =~ /^(CRON|cron|systemd|atd|\(systemd\))$/ {
      grok {
        match => {
          "body" => [
            "pam_unix\(%{DATA:pam_service}\):\s*session\s+%{WORD:session_status}\s+for\s+user\s+%{DATA:user}\(uid=%{INT:uid}\)\s+by\s+%{DATA:by_user}\(uid=%{INT:by_uid}\)",
            "pam_unix\(%{DATA:pam_service}\):\s*session\s+%{WORD:session_status}\s+for\s+user\s+%{DATA:user}\(uid=%{INT:uid}\)"
          ]
        }
        tag_on_failure => ["_pam_session_parse_failed"]
      }
    }

    # --- 3. sudo ---
    if [program] == "sudo" {
      grok {
        match => {
          "body" => [
            "pam_unix\(%{DATA:pam_service}\):\s*authentication\s+failure;\s*logname=%{DATA:logname}\s+uid=%{INT:uid}\s+euid=%{INT:euid}\s+tty=%{DATA:tty}\s+ruser=%{DATA:ruser}\s+rhost=%{DATA:rhost}\s+user=%{DATA:user}"
          ]
        }
        add_tag => ["sudo_auth_failure"]
        tag_on_failure => []
      }

      grok {
        match => {
          "body" => [
            "%{DATA:sudo_user}\s*:\s*TTY=%{DATA:tty}\s*;\s*PWD=%{DATA:pwd}\s*;\s*USER=%{DATA:runas_user}\s*;\s*COMMAND=%{GREEDYDATA:command}"
          ]
        }
        add_tag => ["sudo_command"]
        tag_on_failure => []
      }

      grok {
        match => {
          "body" => [
            "pam_unix\(sudo:session\):\s*session\s+%{WORD:session_status}\s+for\s+user\s+%{DATA:user}\(uid=%{INT:uid}\)\s+by\s+%{DATA:by_user}\(uid=%{INT:by_uid}\)"
          ]
        }
        tag_on_failure => []
      }
    }

    if [session_status] == "opened" { mutate { add_field => { "event_outcome" => "success" } } }
    if [session_status] == "closed" { mutate { add_field => { "event_outcome" => "success" } } }
    if "sudo_auth_failure" in [tags] { mutate { add_field => { "event_outcome" => "failure" } } }



  } else {

    grok {
      match => { "message" => '%{IPORHOST:client_ip} - - \[%{HTTPDATE:timestamp}\] "%{WORD:http_method} %{URIPATHPARAM:request} HTTP/%{NUMBER:http_version}" %{NUMBER:response_code:int} %{NUMBER:bytes_sent:int} "%{GREEDYDATA:referrer}" "%{GREEDYDATA:user_agent}" "%{GREEDYDATA:other}"' }
    }

    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
    }

    useragent {
      source => "user_agent"
      target => "user_agent_details"
    }
  }
}

output {
  if [fields][service] == "auth_log" {
    stdout { }
    elasticsearch {
      hosts => [ "${ES_HOST}" ]
      index => "auth_log-%{+YYYY.MM.dd}"
    }
  } else {
    stdout { }
    elasticsearch {
      hosts => [ "${ES_HOST}" ]
      index => "logs_app_gen-%{+YYYY.MM.dd}"
    }
  }
}