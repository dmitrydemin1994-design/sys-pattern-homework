filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/app/access.log
    fields:
      service: log_gen

  - type: log
    enabled: true
    paths:
      - /var/log/auth/auth.log
    fields:
      service: auth_log

output.logstash:
  enabled: true
  hosts: ["logstash:5044"]

logging.level: info
